services:
  - type: worker
    name: feishu-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python ws_client_v4.py
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: CLAUDE_API_KEY
        sync: false
      - key: CLAUDE_BASE_URL
        sync: false
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_CHAT_ID
        sync: false
      - key: STORAGE_PATH
        value: /data
